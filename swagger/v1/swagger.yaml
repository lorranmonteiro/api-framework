info:
  title: Padronização de respostas de erro em APIs REST
  version: 1.0.0
  contact:
    name: Lorran Monteiro
    email: lorrandec@gmail.com
  description: "Esta API foi desenvolvida como parte de um Trabalho de Conclusão de
    Curso (TCC) em Engenharia de Software,\ncom foco na análise crítica de padrões
    de resposta de erro em APIs REST.\n\nMotivação:\nA literatura recomenda o RFC
    7807 (Problem Details for HTTP APIs), mas na prática muitas APIs populares\nadotam
    formatos próprios por limitações do RFC — principalmente para representar múltiplos
    erros e\nsimplificar o consumo por aplicações cliente. Este projeto implementa
    e documenta um padrão unificado\ninspirado na literatura e em práticas de mercado.\n\nComo
    usar esta documentação:\n- Abra um endpoint e clique em \"Test request\" (no Scalar)
    ou \"Try it out\" (no Swagger UI) para executar requisições diretamente no navegador,
    ajuste os parâmetros e envie a requisição.\n- Use os exemplos de payload para
    simular casos de sucesso e falha (422, 404, 500).\n- Para observar múltiplos erros,
    envie campos inválidos/ausentes em endpoints de criação/atualização.\n- Todas
    as falhas seguem o mesmo contrato: \"errors[]\" (lista de erros) + \"metadata\"
    (dados da requisição).\n\nOBS:\nEsta API não possui autenticação/autorização por
    escolha de escopo, mantendo o foco no contrato de erros,\ntestes automatizados
    e documentação orientada a contrato (OpenAPI).\n\n\U0001F4CC Um formulário foi
    disponibilizado para coleta de feedbacks e sugestões:\nhttps://forms.gle/8FWQB2RUCCF45aoM6\n\nSua
    participação é fundamental para o refinamento e validação desta proposta acadêmica.\n\nRepositório
    do projeto no Github:\nhttps://github.com/lorranmonteiro/api-rest-error-handling\n"
paths:
