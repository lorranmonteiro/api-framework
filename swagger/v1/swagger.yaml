                    errors:
                    - errorType: FIELD_VALIDATION
                      message: Email can't be blank
                    metadata:
                      requestId: c8f8c9c2-9dcb-4e9b-b5c2-123456789abc
                      occurredAt: '2025-01-01T12:00:00Z'
                      path: "/api/v1/customers"
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
