components:
  schemas:
    ErrorType:
      type: string
      description: Código semântico e estável do erro
      enum:
      - FIELD_VALIDATION
      - BUSINESS_VALIDATION
      - NOT_FOUND
      - INTERNAL_SERVER_ERROR
      example: FIELD_VALIDATION
    Error:
      type: object
      description: Representa um erro individual retornado pela API
      properties:
        errorType:
          "$ref": "#/components/schemas/ErrorType"
        message:
          type: string
          example: Email can't be blank
          description: Mensagem descritiva do erro
      required:
      - errorType
      - message
    ErrorMetadata:
      type: object
      description: Metadados relacionados à requisição que gerou o erro
      properties:
        requestId:
          type: string
          example: c8f8c9c2-9dcb-4e9b-b5c2-123456789abc
        occurredAt:
          type: string
          format: date-time
          example: '2025-01-01T12:00:00Z'
        path:
          type: string
          example: "/api/v1/customers/999"
      required:
      - requestId
      - occurredAt
      - path
    ErrorResponse:
      type: object
      description: Resposta padrão de erro da API
      properties:
        errors:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/Error"
        metadata:
          "$ref": "#/components/schemas/ErrorMetadata"
      required:
      - errors
      - metadata
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Keyboard
        description:
          type: string
          nullable: true
          example: Mechanical keyboard
        price:
          type: string
          format: decimal
          example: '199.99'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - price
    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        phone:
          type: string
          nullable: true
          example: '999999999'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email
    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        customer_id:
          type: integer
          example: 1
        status:
          type: string
          example: new
        total_amount:
          type: string
          format: decimal
          example: '250.00'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - customer_id
      - status
      - total_amount
    OrderProduct:
      type: object
      properties:
        id:
          type: integer
          example: 1
        order_id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
        price:
          type: string
          format: decimal
          example: '100.00'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - order_id
      - product_id
      - quantity
